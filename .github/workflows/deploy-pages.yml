# Publishes the static prototype to GitHub Pages.
# Triggered only from main (and manual dispatch on main). Feature branches do not deploy.
# Pages is already configured as build_type=workflow; this file is the workflow it runs.
# upload-pages-artifact excludes .git and .github itself. There is no build step:
# index.html at the repo root is the site.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
