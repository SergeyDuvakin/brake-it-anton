# Publishes the static prototype to GitHub Pages.
# Triggered only from main (and manual dispatch on main). Feature branches do not deploy.
# The uploaded directory is a copy of the playable files, not the whole repository.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site files
        run: |
          set -eu
          rm -rf .pages-dist
          mkdir -p .pages-dist/js .pages-dist/assets/fonts .pages-dist/assets/cars .pages-dist/icons
          cp index.html .pages-dist/index.html
          cp style.css .pages-dist/style.css
          cp manifest.webmanifest .pages-dist/manifest.webmanifest
          cp icons/favicon-32.png .pages-dist/icons/favicon-32.png
          cp icons/apple-touch-icon.png .pages-dist/icons/apple-touch-icon.png
          cp icons/icon-192.png .pages-dist/icons/icon-192.png
          cp icons/icon-512.png .pages-dist/icons/icon-512.png
          cp js/anchors.js .pages-dist/js/anchors.js
          cp js/audio.js .pages-dist/js/audio.js
          cp js/clock.js .pages-dist/js/clock.js
          cp js/config.js .pages-dist/js/config.js
          cp js/draw.js .pages-dist/js/draw.js
          cp js/gait.js .pages-dist/js/gait.js
          cp js/game.js .pages-dist/js/game.js
          cp js/geom.js .pages-dist/js/geom.js
          cp js/missions.js .pages-dist/js/missions.js
          cp js/physics.js .pages-dist/js/physics.js
          cp js/policies.js .pages-dist/js/policies.js
          cp js/rng.js .pages-dist/js/rng.js
          cp js/road.js .pages-dist/js/road.js
          cp js/session.js .pages-dist/js/session.js
          cp js/sim.js .pages-dist/js/sim.js
          cp js/storage.js .pages-dist/js/storage.js
          cp js/viewport.js .pages-dist/js/viewport.js
          cp assets/fonts/BalsamiqSans-Bold.ttf .pages-dist/assets/fonts/BalsamiqSans-Bold.ttf
          cp assets/fonts/BalsamiqSans-Regular.ttf .pages-dist/assets/fonts/BalsamiqSans-Regular.ttf
          cp assets/fonts/RubikMonoOne-Regular.ttf .pages-dist/assets/fonts/RubikMonoOne-Regular.ttf
          cp assets/cars/yellow-car-game-straight.png .pages-dist/assets/cars/yellow-car-game-straight.png
          cp assets/cars/yellow-car-brake.png .pages-dist/assets/cars/yellow-car-brake.png
          cp assets/cars/yellow-car-collision.png .pages-dist/assets/cars/yellow-car-collision.png
          cp assets/cars/coral-wagon-straight.png .pages-dist/assets/cars/coral-wagon-straight.png
          test -f .pages-dist/index.html
          test -f .pages-dist/style.css
          test -f .pages-dist/js/game.js
          test -f .pages-dist/js/draw.js
          test -f .pages-dist/js/road.js
          test -f .pages-dist/assets/fonts/BalsamiqSans-Bold.ttf
          test -f .pages-dist/assets/cars/yellow-car-game-straight.png
          test -f .pages-dist/assets/cars/coral-wagon-straight.png
          test ! -e .pages-dist/README.md
          test ! -e .pages-dist/package.json
          test ! -e .pages-dist/package-lock.json
          test ! -e .pages-dist/docs
          test ! -e .pages-dist/test
          test ! -e .pages-dist/artifacts
          test ! -e .pages-dist/.git
          test -f .pages-dist/manifest.webmanifest
          test -f .pages-dist/icons/favicon-32.png
          test -f .pages-dist/icons/apple-touch-icon.png
          test -f .pages-dist/icons/icon-192.png
          test -f .pages-dist/icons/icon-512.png
          test ! -e .pages-dist/icons/anton-wheel-1024.png
          grep -q 'href="style.css"' .pages-dist/index.html
          grep -q 'src="js/game.js"' .pages-dist/index.html
          grep -q 'href="manifest.webmanifest"' .pages-dist/index.html
          grep -q 'href="icons/apple-touch-icon.png"' .pages-dist/index.html
          grep -q 'href="icons/favicon-32.png"' .pages-dist/index.html
          grep -q '"start_url": "/brake-it-anton/"' .pages-dist/manifest.webmanifest
          grep -q '"src": "icons/icon-192.png"' .pages-dist/manifest.webmanifest
          grep -q '"src": "icons/icon-512.png"' .pages-dist/manifest.webmanifest
          grep -q 'assets/fonts/' .pages-dist/style.css
          grep -q 'assets/fonts/' .pages-dist/js/game.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
