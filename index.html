<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAC83C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anton">
  <title>Инструктор — Brake It, Anton</title>
  <link rel="icon" href="./assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png" type="image/png" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="rotate" role="status">
    <div class="phone" aria-hidden="true"></div>
    <p class="rot-title">Поверни телефон</p>
    <p>Инструктору нужна альбомная ориентация 16:9. Вертикальной версии нет.</p>
  </div>
  <div id="wrap">
    <canvas id="game" width="1600" height="900"></canvas>
    <p id="home-hint" hidden>Поделиться → На экран «Домой» → Открыть как веб-приложение</p>
  </div>
  <script type="module" src="js/game.js"></script>

</html>
