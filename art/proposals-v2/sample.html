<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Образец ассетов, не принято</title>
</head>
<body>
<script>
const INK = "#1C161E";
const PAPER = "#F6ECD6";
const YEL = "#FAC83C";
const YEL_SHADE = "#E2B02A";
const PINK = "#F296A0";
const PINK_SHADE = "#D97886";
const SKIN = "#F0BE8C";
const SKIN_SHADE = "#E0A872";
const TEAL = "#3CAAA0";
const TEAL_SHADE = "#2E8C84";
const ORANGE = "#E68246";
const BROWN = "#8A5A3A";
const BROWN_SHADE = "#6E442C";
const GLASS = "#AADCEB";
const RED = "#E83428";

function make(id, w, h) {
  const c = document.createElement("canvas");
  c.id = id;
  c.width = w;
  c.height = h;
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  return ctx;
}

function ink(ctx, w) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = w;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
}

function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function fillStroke(ctx, fill, w) {
  ctx.fillStyle = fill;
  ctx.fill();
  ink(ctx, w);
  ctx.stroke();
}

function limb(ctx, x0, y0, cx, cy, x1, y1, outer, inner) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(cx, cy, x1, y1);
  ink(ctx, outer);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(cx, cy, x1, y1);
  ctx.strokeStyle = SKIN;
  ctx.lineWidth = inner;
  ctx.stroke();
}

function grip(ctx, x, y, side) {
  const d = side < 0 ? -1 : 1;
  ctx.fillStyle = SKIN;
  for (const [fx, fy, r] of [[d * 8, -9, 5], [d * 13, 0, 5], [d * 9, 8, 4.5]]) {
    ctx.beginPath();
    ctx.arc(x + fx, y + fy, r, 0, Math.PI * 2);
    fillStroke(ctx, SKIN, 3);
  }
  ctx.beginPath();
  ctx.arc(x, y, 12, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 3);
  ctx.beginPath();
  ctx.ellipse(x - d * 7, y + 7, 6, 4, d * 0.4, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 3);
}

function wheel(ctx, x, y) {
  ctx.beginPath();
  ctx.ellipse(x, y, 86, 34, 0, 0, Math.PI * 2);
  ink(ctx, 16);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(x, y, 64, 20, 0, 0, Math.PI * 2);
  ctx.strokeStyle = PAPER;
  ctx.lineWidth = 3;
  ctx.stroke();
  ink(ctx, 6);
  ctx.beginPath();
  ctx.moveTo(x - 40, y + 2);
  ctx.lineTo(x - 10, y);
  ctx.moveTo(x + 40, y + 2);
  ctx.lineTo(x + 10, y);
  ctx.moveTo(x, y + 16);
  ctx.lineTo(x, y + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y + 1, 8, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.strokeStyle = PAPER;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function antonHead(ctx, mood) {
  ctx.beginPath();
  ctx.ellipse(0, 0, 112, 100, 0, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 6);
  ctx.beginPath();
  ctx.ellipse(-104, 18, 16, 22, 0, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 4);
  ctx.beginPath();
  ctx.ellipse(104, 26, 14, 18, 0, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 4);
  ink(ctx, 5);
  ctx.beginPath();
  [[-36, -12], [-12, 14], [14, 40]].forEach(([hx, lean], i) => {
    ctx.moveTo(hx, -86);
    ctx.quadraticCurveTo(hx + lean, -128 - (mood === "wake" ? 10 : 0), hx + 12, -98);
  });
  ctx.stroke();
  if (mood === "asleep") {
    ink(ctx, 5);
    ctx.beginPath();
    ctx.moveTo(-52, -6);
    ctx.quadraticCurveTo(-32, 2, -12, -4);
    ctx.moveTo(16, 10);
    ctx.quadraticCurveTo(30, 16, 46, 12);
    ctx.moveTo(-18, 48);
    ctx.quadraticCurveTo(4, 56, 24, 46);
    ctx.stroke();
    return;
  }
  const heavy = mood === "drowsy";
  const wide = mood === "wake" || mood === "earnest";
  eye(ctx, -32, -10, heavy ? 26 : wide ? 32 : 26, heavy ? 9 : wide ? 28 : 22, wide ? 9 : 8, heavy);
  eye(ctx, 30, 8, heavy ? 16 : wide ? 20 : 16, heavy ? 6 : wide ? 18 : 14, wide ? 6 : 5, heavy);
  ink(ctx, 6);
  ctx.beginPath();
  if (mood === "earnest") {
    ctx.moveTo(-58, -34);
    ctx.lineTo(-8, -48);
    ctx.moveTo(14, -22);
    ctx.lineTo(52, -34);
  } else if (mood === "wake") {
    ctx.moveTo(-62, -58);
    ctx.lineTo(-8, -36);
    ctx.moveTo(12, -30);
    ctx.lineTo(54, -48);
  } else if (mood === "drowsy") {
    ctx.moveTo(-58, -28);
    ctx.lineTo(-8, -34);
    ctx.moveTo(14, -10);
    ctx.lineTo(50, -16);
  } else {
    ctx.moveTo(-58, -40);
    ctx.quadraticCurveTo(-32, -54, -8, -40);
    ctx.moveTo(14, -18);
    ctx.quadraticCurveTo(32, -28, 52, -16);
  }
  ctx.stroke();
  ink(ctx, 5);
  ctx.beginPath();
  if (mood === "drowsy") {
    ctx.moveTo(-16, 52);
    ctx.quadraticCurveTo(4, 58, 22, 52);
  } else if (mood === "wake") {
    ctx.arc(2, 48, 12, 0, Math.PI * 2);
  } else if (mood === "earnest") {
    ctx.moveTo(-22, 46);
    ctx.quadraticCurveTo(4, 64, 26, 44);
  } else {
    ctx.moveTo(-24, 46);
    ctx.quadraticCurveTo(2, 68, 28, 44);
  }
  ctx.stroke();
}

function eye(ctx, x, y, rx, ry, pupil, shut) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, shut ? 4 : ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = PAPER;
  ctx.fill();
  ink(ctx, 4);
  ctx.stroke();
  if (shut) return;
  ctx.beginPath();
  ctx.arc(x + 2, y + 2, pupil, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
}

function antonTorso(ctx) {
  roundRect(ctx, -100, 70, 200, 150, 24);
  fillStroke(ctx, TEAL, 6);
  ctx.beginPath();
  ctx.moveTo(-70, 96);
  ctx.lineTo(86, 118);
  ctx.lineTo(96, 168);
  ctx.lineTo(-80, 176);
  ctx.closePath();
  ctx.fillStyle = TEAL_SHADE;
  ctx.fill();
  ink(ctx, 5);
  ctx.beginPath();
  ctx.moveTo(-78, 88);
  ctx.lineTo(30, 150);
  ctx.stroke();
}

function drawAnton(ctx, mood) {
  ctx.save();
  ctx.translate(320, 250);
  antonTorso(ctx);
  if (mood === "asleep") {
    limb(ctx, -70, 150, -120, 230, -150, 340, 16, 8);
    limb(ctx, 70, 150, 130, 230, 160, 340, 16, 8);
    antonHead(ctx, mood);
    grip(ctx, -150, 348, -1);
    grip(ctx, 160, 348, 1);
  } else if (mood === "phone") {
    limb(ctx, -102, 128, -130, 180, -78, 248, 16, 8);
    limb(ctx, 90, 130, 150, 90, 118, 20, 16, 8);
    wheel(ctx, 0, 260);
    grip(ctx, -78, 256, -1);
    antonHead(ctx, "drive");
    grip(ctx, 118, 16, 1);
    ctx.save();
    ctx.translate(150, -10);
    ctx.rotate(-0.35);
    roundRect(ctx, -22, -40, 48, 84, 8);
    fillStroke(ctx, INK, 4);
    roundRect(ctx, -14, -28, 32, 54, 4);
    ctx.fillStyle = GLASS;
    ctx.fill();
    ctx.restore();
  } else {
    limb(ctx, -102, 128, -140, 190, -72, 248, 16, 8);
    limb(ctx, 102, 128, 146, 190, 74, 250, 16, 8);
    wheel(ctx, 0, 260);
    grip(ctx, -72, 256, -1);
    grip(ctx, 74, 258, 1);
    antonHead(ctx, mood);
  }
  ctx.restore();
}

function pantLeg(ctx, x0, y0, x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(x1, y1, x2, y2);
  ink(ctx, 22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(x1, y1, x2, y2);
  ctx.strokeStyle = "#2A3144";
  ctx.lineWidth = 14;
  ctx.stroke();
}

function drawPed(ctx) {
  ctx.save();
  ctx.translate(180, 80);
  pantLeg(ctx, 6, 168, 34, 270, 10, 400);
  pantLeg(ctx, -10, 170, -46, 260, -30, 388);
  roundRect(ctx, -4, 392, 36, 16, 6);
  fillStroke(ctx, INK, 3);
  roundRect(ctx, -48, 378, 34, 16, 6);
  fillStroke(ctx, INK, 3);
  roundRect(ctx, -58, 78, 120, 110, 28);
  fillStroke(ctx, ORANGE, 6);
  ctx.beginPath();
  ctx.moveTo(-40, 100);
  ctx.quadraticCurveTo(0, 150, 46, 108);
  ctx.lineTo(40, 160);
  ctx.quadraticCurveTo(0, 190, -36, 158);
  ctx.closePath();
  ctx.fillStyle = "#C86A32";
  ctx.fill();
  limb(ctx, -40, 100, -80, 150, -70, 210, 12, 6);
  limb(ctx, 48, 102, 90, 70, 70, 30, 12, 6);
  ctx.beginPath();
  ctx.ellipse(2, 10, 58, 62, -0.05, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 5);
  ctx.beginPath();
  ctx.ellipse(-52, 18, 10, 14, -0.2, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 3);
  ctx.beginPath();
  ctx.ellipse(54, 22, 9, 12, 0.2, 0, Math.PI * 2);
  fillStroke(ctx, SKIN, 3);
  ink(ctx, 4);
  ctx.beginPath();
  ctx.moveTo(-20, -48);
  ctx.quadraticCurveTo(-8, -78, 8, -50);
  ctx.moveTo(6, -52);
  ctx.quadraticCurveTo(18, -84, 28, -48);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-16, -8, 12, 14, 0, 0, Math.PI * 2);
  fillStroke(ctx, PAPER, 3);
  ctx.beginPath();
  ctx.ellipse(18, 2, 11, 13, 0, 0, Math.PI * 2);
  fillStroke(ctx, PAPER, 3);
  ctx.beginPath();
  ctx.arc(-14, -4, 5, 0, Math.PI * 2);
  ctx.arc(20, 4, 5, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  ink(ctx, 4);
  ctx.beginPath();
  ctx.moveTo(2, 8);
  ctx.quadraticCurveTo(10, 22, 6, 28);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-16, 36);
  ctx.quadraticCurveTo(4, 48, 22, 32);
  ctx.stroke();
  ctx.save();
  ctx.translate(78, 8);
  ctx.rotate(-0.4);
  roundRect(ctx, -14, -28, 32, 52, 6);
  fillStroke(ctx, INK, 3);
  roundRect(ctx, -8, -18, 20, 30, 3);
  ctx.fillStyle = GLASS;
  ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawDog(ctx) {
  ctx.save();
  ctx.translate(40, 40);
  const legs = [
    [70, 150, 62, 230, 58, 250],
    [120, 156, 128, 236, 136, 252],
    [230, 148, 220, 228, 214, 248],
    [280, 152, 292, 232, 304, 254],
  ];
  legs.forEach(([x0, y0, x1, y1, x2, y2], i) => {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x1, y1, x2, y2 - 10);
    ink(ctx, 16);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x1, y1, x2, y2 - 10);
    ctx.strokeStyle = BROWN;
    ctx.lineWidth = 9;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x2, y2, 18, 9, i % 2 ? 0.25 : -0.2, 0, Math.PI * 2);
    fillStroke(ctx, BROWN_SHADE, 3);
    ctx.beginPath();
    ctx.ellipse(x2 + (i % 2 ? 8 : -8), y2 + 2, 6, 4, 0, 0, Math.PI * 2);
    fillStroke(ctx, BROWN_SHADE, 2);
  });
  ctx.beginPath();
  ctx.ellipse(180, 150, 130, 58, -0.08, 0, Math.PI * 2);
  fillStroke(ctx, BROWN, 6);
  ctx.beginPath();
  ctx.ellipse(250, 132, 46, 28, 0.2, 0, Math.PI * 2);
  fillStroke(ctx, BROWN_SHADE, 4);
  ctx.beginPath();
  ctx.ellipse(300, 118, 48, 42, 0.15, 0, Math.PI * 2);
  fillStroke(ctx, BROWN, 5);
  ctx.beginPath();
  ctx.ellipse(346, 128, 28, 16, 0.1, 0, Math.PI * 2);
  fillStroke(ctx, BROWN, 4);
  ctx.beginPath();
  ctx.ellipse(368, 126, 8, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(286, 78, 18, 28, -0.4, 0, Math.PI * 2);
  fillStroke(ctx, BROWN, 4);
  ctx.beginPath();
  ctx.ellipse(322, 104, 10, 8, 0, 0, Math.PI * 2);
  fillStroke(ctx, PAPER, 3);
  ctx.beginPath();
  ctx.arc(324, 104, 3, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  ink(ctx, 5);
  ctx.beginPath();
  ctx.moveTo(60, 140);
  ctx.quadraticCurveTo(20, 100, 36, 168);
  ctx.stroke();
  ctx.restore();
}

function roadWheel(ctx, x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  ink(ctx, 4);
  ctx.stroke();
  ctx.strokeStyle = PAPER;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.55, y);
  ctx.lineTo(x + r * 0.55, y + 2);
  ctx.moveTo(x, y - r * 0.45);
  ctx.lineTo(x + 2, y + r * 0.5);
  ctx.stroke();
}

function drawCar(ctx, color, shade, plate, drop = 0) {
  ctx.save();
  ctx.translate(0, drop);
  ctx.beginPath();
  ctx.ellipse(320, 400, 210, 26, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(28,22,30,0.16)";
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(248, 150);
  ctx.quadraticCurveTo(150, 190, 140, 300);
  ctx.quadraticCurveTo(132, 378, 320, 390);
  ctx.quadraticCurveTo(508, 378, 500, 300);
  ctx.quadraticCurveTo(490, 190, 392, 150);
  ctx.quadraticCurveTo(320, 136, 248, 150);
  fillStroke(ctx, color, 6);
  ctx.beginPath();
  ctx.moveTo(268, 86);
  ctx.quadraticCurveTo(210, 110, 230, 156);
  ctx.lineTo(410, 156);
  ctx.quadraticCurveTo(430, 110, 372, 86);
  ctx.quadraticCurveTo(320, 74, 268, 86);
  fillStroke(ctx, color, 5);
  ctx.beginPath();
  ctx.moveTo(330, 80);
  ctx.quadraticCurveTo(420, 120, 410, 156);
  ctx.lineTo(330, 156);
  ctx.closePath();
  ctx.fillStyle = shade;
  ctx.fill();
  roundRect(ctx, 210, 168, 220, 120, 16);
  fillStroke(ctx, color, 5);
  roundRect(ctx, 232, 184, 176, 64, 10);
  ctx.fillStyle = GLASS;
  ctx.fill();
  ink(ctx, 4);
  ctx.stroke();
  roundRect(ctx, 258, 300, 124, 50, 8);
  fillStroke(ctx, plate ? RED : PAPER, 4);
  if (plate) {
    ctx.fillStyle = PAPER;
    ctx.font = "700 30px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("У", 320, 326);
  }
  roundRect(ctx, 168, 348, 34, 14, 3);
  ctx.fillStyle = ORANGE;
  ctx.fill();
  roundRect(ctx, 438, 348, 34, 14, 3);
  ctx.fill();
  ctx.restore();
  roadWheel(ctx, 148, 352, 40);
  roadWheel(ctx, 492, 352, 40);
  roadWheel(ctx, 214, 156, 28);
  roadWheel(ctx, 426, 156, 28);
}

function drawBin(ctx) {
  roundRect(ctx, 70, 70, 150, 200, 16);
  fillStroke(ctx, "#5E7A52", 6);
  roundRect(ctx, 86, 150, 118, 100, 10);
  ctx.fillStyle = "#4A6844";
  ctx.fill();
  roundRect(ctx, 58, 48, 174, 36, 8);
  fillStroke(ctx, "#3E5A36", 5);
  ink(ctx, 5);
  ctx.beginPath();
  ctx.moveTo(168, 48);
  ctx.quadraticCurveTo(190, 20, 176, 8);
  ctx.stroke();
  roadWheel(ctx, 78, 268, 18);
}

function drawLid(ctx) {
  ctx.beginPath();
  ctx.ellipse(140, 110, 100, 36, -0.08, 0, Math.PI * 2);
  fillStroke(ctx, "#6E8A62", 6);
  ctx.beginPath();
  ctx.ellipse(140, 98, 88, 28, -0.08, 0, Math.PI * 2);
  fillStroke(ctx, "#4A6844", 4);
  ink(ctx, 6);
  ctx.beginPath();
  ctx.moveTo(140, 78);
  ctx.quadraticCurveTo(150, 30, 180, 24);
  ctx.stroke();
}

function drawHole(ctx) {
  ctx.beginPath();
  ctx.ellipse(140, 110, 100, 48, 0.05, 0, Math.PI * 2);
  fillStroke(ctx, "#3A342C", 6);
  ctx.beginPath();
  ctx.ellipse(140, 114, 72, 32, -0.04, 0, Math.PI * 2);
  fillStroke(ctx, "#241C16", 4);
  ink(ctx, 4);
  ctx.strokeStyle = YEL;
  ctx.beginPath();
  ctx.moveTo(90, 110);
  ctx.quadraticCurveTo(70, 80, 60, 70);
  ctx.moveTo(170, 120);
  ctx.quadraticCurveTo(200, 90, 210, 78);
  ctx.stroke();
}

const jobs = [
  ["anton-drive", 640, 760, (ctx) => drawAnton(ctx, "drive")],
  ["anton-phone", 640, 760, (ctx) => drawAnton(ctx, "phone")],
  ["anton-drowsy", 640, 760, (ctx) => drawAnton(ctx, "drowsy")],
  ["anton-asleep", 640, 760, (ctx) => drawAnton(ctx, "asleep")],
  ["anton-earnest", 640, 760, (ctx) => drawAnton(ctx, "earnest")],
  ["anton-wake", 640, 760, (ctx) => drawAnton(ctx, "wake")],
  ["ped-one", 360, 560, drawPed],
  ["dog", 460, 320, drawDog],
  ["car-forward", 640, 460, (ctx) => drawCar(ctx, YEL, YEL_SHADE, true, 0)],
  ["car-brake", 640, 460, (ctx) => drawCar(ctx, YEL, YEL_SHADE, true, 16)],
  ["car-other", 640, 460, (ctx) => drawCar(ctx, TEAL, TEAL_SHADE, false, 0)],
  ["bin", 280, 320, drawBin],
  ["lid", 280, 180, drawLid],
  ["hole", 280, 200, drawHole],
];

const meta = [];
for (const [id, w, h, fn] of jobs) {
  const ctx = make(id, w, h);
  fn(ctx);
  meta.push({ id, w, h, file: `${id}.png` });
}

const contact = make("contact", 1800, 2100);
contact.setTransform(1, 0, 0, 1, 0, 0);
contact.fillStyle = "#E7DCC6";
contact.fillRect(0, 0, 1800, 2100);
contact.fillStyle = INK;
contact.font = "700 28px sans-serif";
contact.fillText("Образец для смотра. В игру не встроено.", 28, 42);
contact.font = "16px sans-serif";
contact.fillText("Круглый Антон, чужой пешеход, собака, машина вдоль дороги.", 28, 70);
const sample = [
  ["anton-drive", 24, 90, 340, 404],
  ["anton-phone", 380, 90, 340, 404],
  ["ped-one", 740, 90, 230, 358],
  ["dog", 990, 180, 300, 209],
  ["car-forward", 1300, 120, 460, 330],
];
contact.font = "700 15px sans-serif";
for (const [id, x, y, w, h] of sample) {
  contact.drawImage(document.getElementById(id), x, y, w, h);
  contact.fillStyle = INK;
  contact.fillText(id, x, y + h + 20);
}
contact.font = "700 22px sans-serif";
contact.fillText("Остальные состояния этого же рисунка", 28, 560);
let col = 0;
let rowY = 590;
const rest = jobs.filter(([id]) => !["anton-drive", "anton-phone", "ped-one", "dog", "car-forward"].includes(id));
for (const [id] of rest) {
  const src = document.getElementById(id);
  const w = 280;
  const h = Math.round(src.height * (w / src.width));
  const x = 24 + col * 300;
  contact.drawImage(src, x, rowY, w, h);
  contact.font = "700 14px sans-serif";
  contact.fillStyle = INK;
  contact.fillText(id, x, rowY + h + 18);
  col += 1;
  if (col === 6) {
    col = 0;
    rowY += 420;
  }
}
window.__proposalMeta = meta;
window.__proposalsReady = true;
</script>
</body>
</html>
