<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Предложения ассетов — не принято</title>
  <style>
    body { margin: 0; background: #2a2428; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
const INK = "#1C161E";
const PAPER = "#F6ECD6";
const YEL = "#FAC83C";
const PINK = "#F296A0";
const SKIN = "#F0BE8C";
const TEAL = "#3CAAA0";
const ORANGE = "#E68246";
const MUSTARD = "#CDB56A";
const BLUE = "#5A8CDC";
const RED = "#E83428";
const GLASS = "#AADCEB";
const BROWN = "#8A5A3A";
const BIN = "#5E7A52";
const HOLE = "#241C16";

function hash(n) {
  let x = Math.imul(n | 0, 0x9e3779b1);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

function sheet() {
  const c = document.createElement("canvas");
  c.width = 1;
  c.height = 1;
  return c;
}

function make(id, w, h) {
  const c = document.createElement("canvas");
  c.id = id;
  c.width = w;
  c.height = h;
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.translate(0.5, 0.5);
  return ctx;
}

function ink(ctx, w) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = w;
}

function poly(ctx, pts, fill, w) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i += 1) {
    const a = pts[i - 1];
    const b = pts[i];
    const k = hash(i * 13 + pts.length * 7 + (w | 0));
    ctx.quadraticCurveTo((a[0] + b[0]) / 2 + (k - 0.5) * 5, (a[1] + b[1]) / 2 + (hash(i * 3 + 1) - 0.5) * 4, b[0], b[1]);
  }
  ctx.closePath();
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  ink(ctx, w);
  ctx.stroke();
}

function blob(ctx, x, y, rx, ry, fill, w, lean) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, lean || 0, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ink(ctx, w);
  ctx.stroke();
}

function stroke(ctx, pts, w) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i][0], pts[i][1]);
  ink(ctx, w);
  ctx.stroke();
}

function antonHead(ctx, x, y, mood) {
  poly(ctx, [
    [x - 4, y - 92], [x + 78, y - 78], [x + 96, y - 8], [x + 70, y + 62],
    [x + 8, y + 78], [x - 62, y + 48], [x - 86, y - 6], [x - 70, y - 64],
  ], SKIN, 7);
  blob(ctx, x - 78, y + 8, 16, 22, SKIN, 5, -0.2);
  blob(ctx, x + 82, y + 18, 13, 16, SKIN, 5, 0.3);
  stroke(ctx, [[x - 28, y - 96], [x - 34, y - 128], [x - 18, y - 104]], 5);
  stroke(ctx, [[x + 6, y - 100], [x + 2, y - 136], [x + 18, y - 102]], 6);
  stroke(ctx, [[x + 36, y - 90], [x + 48, y - 118], [x + 28, y - 96]], 4);
  if (mood === "asleep") {
    stroke(ctx, [[x - 48, y - 8], [x - 18, y - 2], [x - 46, y + 6]], 5);
    stroke(ctx, [[x + 16, y + 10], [x + 40, y + 16]], 4);
    stroke(ctx, [[x - 10, y + 42], [x + 18, y + 48]], 4);
    return;
  }
  blob(ctx, x - 34, y - 14, mood === "drowsy" ? 22 : 26, mood === "drowsy" ? 10 : 22, PAPER, 5, -0.1);
  blob(ctx, x + 28, y + 4, mood === "drowsy" ? 12 : 14, mood === "drowsy" ? 6 : 12, PAPER, 4, 0.15);
  if (mood !== "drowsy") {
    blob(ctx, x - 30, y - 12, 8, 8, INK, 2, 0);
    blob(ctx, x + 30, y + 6, 5, 5, INK, 2, 0);
  }
  stroke(ctx, [[x - 16, y + 40], [x + 6, y + 54], [x + 28, y + 36]], 5);
}

function wheelHands(ctx, x, y) {
  blob(ctx, x, y, 78, 30, INK, 0, 0);
  ctx.beginPath();
  ctx.ellipse(x, y, 58, 18, 0, 0, Math.PI * 2);
  ctx.fillStyle = TEAL;
  ctx.fill();
  ink(ctx, 4);
  ctx.stroke();
  stroke(ctx, [[x - 36, y + 2], [x - 8, y]], 5);
  stroke(ctx, [[x + 36, y + 2], [x + 8, y]], 5);
  stroke(ctx, [[x, y + 16], [x + 2, y + 6]], 5);
  blob(ctx, x, y + 2, 8, 8, INK, 2, 0);
  grip(ctx, x - 62, y + 6, -1);
  grip(ctx, x + 64, y + 8, 1);
}

function grip(ctx, x, y, side) {
  blob(ctx, x, y, 13, 12, SKIN, 4, side * 0.2);
  blob(ctx, x + side * 10, y - 8, 5, 5, SKIN, 3, 0);
  blob(ctx, x + side * 14, y, 5, 4, SKIN, 3, 0);
  blob(ctx, x + side * 8, y + 8, 4, 4, SKIN, 3, 0);
}

function antonBody(ctx, x, y) {
  poly(ctx, [
    [x - 78, y + 8], [x + 86, y + 2], [x + 96, y + 92], [x + 40, y + 128],
    [x - 70, y + 122], [x - 92, y + 40],
  ], TEAL, 7);
  stroke(ctx, [[x - 60, y + 24], [x + 18, y + 78], [x + 28, y + 96]], 6);
}

function drawAntonDrive(ctx) {
  antonBody(ctx, 210, 210);
  antonHead(ctx, 210, 168, "drive");
  stroke(ctx, [[150, 300], [118, 360], [150, 392]], 14);
  stroke(ctx, [[270, 300], [300, 358], [274, 396]], 14);
  ctx.strokeStyle = SKIN;
  ctx.lineWidth = 7;
  ctx.stroke();
  wheelHands(ctx, 210, 400);
}

function drawAntonPhone(ctx) {
  antonBody(ctx, 210, 230);
  antonHead(ctx, 214, 176, "drive");
  stroke(ctx, [[148, 318], [120, 372], [148, 404]], 14);
  ctx.strokeStyle = SKIN;
  ctx.lineWidth = 7;
  ctx.stroke();
  grip(ctx, 148, 408, -1);
  stroke(ctx, [[268, 310], [300, 250], [286, 188]], 12);
  ctx.strokeStyle = SKIN;
  ctx.lineWidth = 6;
  ctx.stroke();
  grip(ctx, 286, 176, 1);
  poly(ctx, [[300, 150], [338, 146], [344, 214], [306, 220]], INK, 4);
  ctx.fillStyle = GLASS;
  ctx.fillRect(312, 162, 22, 40);
  blob(ctx, 210, 430, 70, 22, INK, 8, 0);
  stroke(ctx, [[168, 430], [210, 428]], 5);
}

function drawAntonDrowsy(ctx) {
  antonBody(ctx, 220, 230);
  antonHead(ctx, 228, 190, "drowsy");
  stroke(ctx, [[160, 330], [140, 390], [168, 418]], 14);
  stroke(ctx, [[280, 328], [308, 388], [276, 420]], 14);
  ctx.strokeStyle = SKIN;
  ctx.lineWidth = 7;
  ctx.stroke();
  wheelHands(ctx, 214, 424);
}

function drawAntonAsleep(ctx) {
  antonBody(ctx, 230, 250);
  antonHead(ctx, 250, 210, "asleep");
  stroke(ctx, [[170, 350], [120, 430], [108, 490]], 14);
  stroke(ctx, [[290, 350], [340, 430], [352, 492]], 14);
  ctx.strokeStyle = SKIN;
  ctx.lineWidth = 7;
  ctx.stroke();
  grip(ctx, 104, 498, -1);
  grip(ctx, 356, 500, 1);
}

function shoe(ctx, x, y, dir) {
  poly(ctx, [[x - 8, y - 6], [x + dir * 16, y - 8], [x + dir * 18, y + 4], [x - 10, y + 6]], INK, 3);
}

function pedCoat(ctx) {
  const x = 140;
  const y = 250;
  shoe(ctx, x - 28, y + 150, -1);
  shoe(ctx, x + 30, y + 146, 1);
  stroke(ctx, [[x - 16, y + 20], [x - 30, y + 80], [x - 26, y + 146]], 8);
  stroke(ctx, [[x + 16, y + 22], [x + 34, y + 70], [x + 28, y + 142]], 8);
  poly(ctx, [[x - 40, y - 10], [x + 36, y - 18], [x + 48, y + 78], [x + 10, y + 96], [x - 46, y + 70]], MUSTARD, 6);
  stroke(ctx, [[x - 34, y + 8], [x - 58, y + 40], [x - 40, y + 78]], 7);
  stroke(ctx, [[x + 28, y + 4], [x + 62, y + 36], [x + 48, y + 70]], 7);
  poly(ctx, [[x - 8, y - 78], [x + 34, y - 70], [x + 28, y - 18], [x - 16, y - 8], [x - 30, y - 48]], SKIN, 5);
  blob(ctx, x + 4, y - 58, 6, 8, SKIN, 3, 0.4);
  blob(ctx, x - 8, y - 62, 5, 5, PAPER, 3, 0);
  blob(ctx, x + 14, y - 54, 4, 4, PAPER, 2, 0);
  blob(ctx, x - 8, y - 62, 2, 2, INK, 1, 0);
  blob(ctx, x + 14, y - 54, 2, 2, INK, 1, 0);
  stroke(ctx, [[x - 6, y - 40], [x + 10, y - 34]], 3);
  stroke(ctx, [[x - 18, y - 86], [x - 10, y - 104]], 4);
  stroke(ctx, [[x + 4, y - 90], [x + 8, y - 112]], 5);
}

function pedScarf(ctx) {
  const x = 130;
  const y = 270;
  shoe(ctx, x - 22, y + 130, -1);
  shoe(ctx, x + 36, y + 118, 1);
  stroke(ctx, [[x - 8, y + 10], [x - 24, y + 70], [x - 18, y + 124]], 9);
  stroke(ctx, [[x + 14, y + 12], [x + 40, y + 64], [x + 32, y + 114]], 9);
  poly(ctx, [[x - 36, y - 20], [x + 40, y - 8], [x + 34, y + 64], [x - 30, y + 72]], PINK, 6);
  poly(ctx, [[x - 20, y - 16], [x + 22, y - 28], [x + 30, y + 8], [x - 8, y + 16], [x - 28, y - 4]], ORANGE, 4);
  stroke(ctx, [[x - 24, y], [x - 52, y + 28], [x - 30, y + 52]], 6);
  stroke(ctx, [[x + 24, y - 4], [x + 58, y - 30], [x + 46, y - 58]], 6);
  poly(ctx, [[x + 40, y - 78], [x + 62, y - 82], [x + 66, y - 40], [x + 42, y - 36]], INK, 3);
  poly(ctx, [[x - 4, y - 70], [x + 30, y - 78], [x + 22, y - 24], [x - 14, y - 16], [x - 22, y - 48]], SKIN, 5);
  stroke(ctx, [[x - 2, y - 58], [x + 8, y - 62]], 4);
  blob(ctx, x + 16, y - 52, 7, 6, PAPER, 3, 0);
  blob(ctx, x + 16, y - 52, 3, 3, INK, 1, 0);
  stroke(ctx, [[x + 2, y - 36], [x + 16, y - 28], [x + 8, y - 22]], 3);
}

function pedCap(ctx) {
  const x = 150;
  const y = 250;
  shoe(ctx, x - 34, y + 156, -1);
  shoe(ctx, x + 18, y + 150, 1);
  stroke(ctx, [[x - 10, y + 30], [x - 36, y + 90], [x - 30, y + 150]], 8);
  stroke(ctx, [[x + 12, y + 28], [x + 8, y + 96], [x + 16, y + 146]], 8);
  poly(ctx, [[x - 34, y - 6], [x + 42, y + 4], [x + 30, y + 80], [x - 40, y + 70]], TEAL, 6);
  stroke(ctx, [[x - 20, y + 10], [x - 70, y + 36], [x - 48, y + 78]], 6);
  stroke(ctx, [[x + 24, y + 12], [x + 78, y + 8], [x + 60, y + 48]], 6);
  poly(ctx, [[x - 16, y - 64], [x + 28, y - 70], [x + 24, y - 16], [x - 20, y - 8]], SKIN, 5);
  poly(ctx, [[x - 28, y - 70], [x + 36, y - 78], [x + 30, y - 58], [x - 22, y - 52]], BLUE, 4);
  blob(ctx, x - 2, y - 48, 4, 5, PAPER, 2, 0);
  blob(ctx, x + 14, y - 42, 6, 5, PAPER, 2, 0);
  blob(ctx, x - 2, y - 48, 2, 2, INK, 1, 0);
  blob(ctx, x + 14, y - 42, 2, 2, INK, 1, 0);
  stroke(ctx, [[x + 2, y - 28], [x + 8, y - 18], [x + 4, y - 12]], 3);
  ctx.fillStyle = PAPER;
  ctx.fillRect(x + 2, y - 16, 7, 8);
  ink(ctx, 2);
  ctx.strokeRect(x + 2, y - 16, 7, 8);
}

function drawDog(ctx, step) {
  const x = 220;
  const y = 150;
  const paws = [[x - 70, y + 70], [x - 24, y + 78], [x + 30, y + 66], [x + 72, y + 74]];
  paws.forEach((p, i) => {
    const lift = (i % 2 === 0 ? step : -step);
    stroke(ctx, [[p[0], y + 10], [p[0] + (i - 1.5) * 4, y + 40], [p[0] + lift, p[1]]], 7);
    poly(ctx, [[p[0] - 10 + lift, p[1] - 4], [p[0] + 12 + lift, p[1] - 6], [p[0] + 14 + lift, p[1] + 6], [p[0] - 12 + lift, p[1] + 4]], BROWN, 3);
  });
  poly(ctx, [
    [x - 90, y + 6], [x - 40, y - 28], [x + 20, y - 18], [x + 78, y + 8],
    [x + 70, y + 36], [x - 20, y + 42], [x - 96, y + 24],
  ], BROWN, 6);
  stroke(ctx, [[x - 88, y + 4], [x - 120, y - 10], [x - 104, y + 16]], 5);
  poly(ctx, [[x + 62, y - 8], [x + 120, y - 20], [x + 132, y + 6], [x + 86, y + 18], [x + 60, y + 8]], BROWN, 5);
  poly(ctx, [[x + 108, y - 6], [x + 138, y - 2], [x + 128, y + 10], [x + 104, y + 8]], BROWN, 3);
  blob(ctx, x + 118, y - 2, 4, 4, INK, 2, 0);
  poly(ctx, [[x + 78, y - 16], [x + 96, y - 48], [x + 70, y - 22]], BROWN, 4);
  blob(ctx, x + 100, y - 8, 6, 5, PAPER, 2, 0);
  blob(ctx, x + 100, y - 8, 2, 2, INK, 1, 0);
}

function forwardCar(ctx, color, plate) {
  const rearL = [70, 300];
  const rearR = [430, 292];
  const frontL = [150, 150];
  const frontR = [350, 146];
  poly(ctx, [frontL, frontR, [rearR[0] - 8, rearR[1] - 20], [rearL[0] + 10, rearL[1] - 16]], color, 6);
  poly(ctx, [[168, 168], [332, 162], [300, 78], [196, 86]], color, 6);
  poly(ctx, [[186, 150], [314, 146], [286, 96], [210, 104]], GLASS, 4);
  poly(ctx, [[210, 250], [290, 246], [284, 286], [214, 290]], plate ? RED : PAPER, 4);
  if (plate) {
    ctx.fillStyle = PAPER;
    ctx.font = "700 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("У", 250, 280);
  }
  poly(ctx, [[96, 286], [132, 280], [128, 302], [92, 306]], ORANGE, 3);
  poly(ctx, [[368, 278], [404, 284], [400, 306], [364, 300]], ORANGE, 3);
  [[118, 286], [392, 280], [176, 168], [334, 162]].forEach(([x, y]) => {
    blob(ctx, x, y, 28, 28, INK, 4, 0);
    stroke(ctx, [[x - 10, y], [x + 12, y + 2]], 3);
  });
}

function drawBin(ctx) {
  poly(ctx, [[70, 250], [176, 242], [168, 78], [84, 70], [58, 160]], BIN, 6);
  poly(ctx, [[62, 78], [186, 64], [178, 40], [74, 48]], "#3E5A36", 5);
  stroke(ctx, [[150, 36], [168, 18], [154, 8]], 5);
  blob(ctx, 78, 248, 16, 16, INK, 4, 0);
  stroke(ctx, [[96, 120], [150, 112]], 3);
}

function drawLid(ctx) {
  poly(ctx, [[40, 120], [200, 108], [214, 156], [54, 170]], "#6E8A62", 6);
  poly(ctx, [[58, 112], [190, 100], [186, 88], [64, 96]], "#3E5A36", 4);
  stroke(ctx, [[120, 92], [116, 48], [148, 36]], 6);
}

function drawHole(ctx) {
  poly(ctx, [[40, 90], [120, 60], [210, 78], [230, 130], [180, 170], [70, 168], [28, 120]], HOLE, 6);
  stroke(ctx, [[80, 110], [60, 80]], 4);
  stroke(ctx, [[150, 120], [190, 96]], 4);
  ctx.strokeStyle = YEL;
  ctx.lineWidth = 4;
  ctx.stroke();
}

const jobs = [
  ["anton-drive", 420, 520, drawAntonDrive, "Антон едет: обе кисти на ободе, без линии через щёки"],
  ["anton-phone", 420, 520, drawAntonPhone, "Антон с телефоном: свободная рука остаётся на руле"],
  ["anton-drowsy", 420, 520, drawAntonDrowsy, "Антон дремлет, руки на руле"],
  ["anton-asleep", 420, 560, drawAntonAsleep, "Антон спит, руки свисают"],
  ["ped-coat", 280, 460, pedCoat, "Пешеход в пальто, не Антон"],
  ["ped-scarf", 280, 460, pedScarf, "Пешеход с шарфом и телефоном"],
  ["ped-cap", 280, 460, pedCap, "Пешеход в кепке"],
  ["dog-step", 460, 280, (ctx) => drawDog(ctx, 8), "Собака, шаг"],
  ["dog-stand", 460, 280, (ctx) => drawDog(ctx, 0), "Собака стоит"],
  ["car-yellow", 500, 380, (ctx) => forwardCar(ctx, YEL, true), "Жёлтая учебная, вид вперёд по дороге"],
  ["car-yellow-brake", 500, 380, (ctx) => { ctx.translate(0, 10); forwardCar(ctx, YEL, true); }, "Та же машина, кузов присел от тормоза, колёса на месте"],
  ["car-other", 500, 380, (ctx) => forwardCar(ctx, TEAL, false), "Чужая машина, тот же ракурс"],
  ["bin", 240, 320, drawBin, "Бак с объёмом"],
  ["lid", 260, 200, drawLid, "Крышка"],
  ["hole", 280, 220, drawHole, "Яма"],
];

const meta = [];
for (const [id, w, h, fn, note] of jobs) {
  const ctx = make(id, w, h);
  fn(ctx);
  meta.push({ id, w, h, note, file: `${id}.png` });
}

const sheetW = 1680;
const sheetH = 2460;
const contact = make("contact", sheetW, sheetH);
contact.setTransform(1, 0, 0, 1, 0, 0);
contact.fillStyle = "#E7DCC6";
contact.fillRect(0, 0, sheetW, sheetH);
contact.fillStyle = INK;
contact.font = "700 28px sans-serif";
contact.fillText("Предложения, не принято в игру", 36, 48);
contact.font = "16px sans-serif";
contact.fillText("Кривой контур, плоский цвет, свой силуэт. Доска-референс отклонена.", 36, 78);
const cells = [
  ["anton-drive", 24, 100], ["anton-phone", 460, 100], ["anton-drowsy", 900, 100], ["anton-asleep", 1280, 100],
  ["ped-coat", 24, 680], ["ped-scarf", 340, 680], ["ped-cap", 660, 680], ["dog-stand", 980, 700], ["dog-step", 1280, 700],
  ["car-yellow", 24, 1180], ["car-other", 560, 1180], ["car-yellow-brake", 1100, 1180],
  ["bin", 24, 1620], ["lid", 300, 1700], ["hole", 600, 1680],
];
for (const [id, x, y] of cells) {
  const src = document.getElementById(id);
  contact.drawImage(src, x, y);
  contact.fillStyle = INK;
  contact.font = "700 16px sans-serif";
  contact.fillText(id, x, y + src.height + 22);
}
contact.fillText("телефонный масштаб", 980, 1640);
let px = 980;
for (const id of ["anton-drive", "ped-coat", "dog-stand", "car-yellow", "bin"]) {
  const src = document.getElementById(id);
  contact.drawImage(src, px, 1660, src.width * 0.38, src.height * 0.38);
  px += src.width * 0.38 + 16;
}

window.__proposalMeta = meta;
window.__proposalsReady = true;
</script>
</body>
</html>
