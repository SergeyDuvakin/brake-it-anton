function make(id, w, h) {
  const c = document.createElement("canvas");
  c.id = id;
  c.width = w;
  c.height = h;
  document.body.appendChild(c);
  const g = c.getContext("2d");
  g.lineJoin = "round";
  g.lineCap = "round";
  return g;
}
function ink(g, w) {
  g.strokeStyle = INK;
  g.lineWidth = w;
  g.lineJoin = "round";
  g.lineCap = "round";
}
function paint(g, fill, w) {
  g.fillStyle = fill;
  g.fill();
  ink(g, w);
  g.stroke();
}
function rr(g, x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function limb(g, x0, y0, c1x, c1y, x1, y1, c2x, c2y, x2, y2, outer, inner, cloth) {
  g.beginPath();
  g.moveTo(x0, y0);
  g.quadraticCurveTo(c1x, c1y, x1, y1);
  ink(g, outer);
  g.stroke();
  g.beginPath();
  g.moveTo(x0, y0);
  g.quadraticCurveTo(c1x, c1y, x1, y1);
  g.strokeStyle = cloth;
  g.lineWidth = inner;
  g.stroke();
  g.beginPath();
  g.arc(x1, y1, outer * 0.38, 0, Math.PI * 2);
  paint(g, cloth, 3);
  g.beginPath();
  g.moveTo(x1, y1);
  g.quadraticCurveTo(c2x, c2y, x2, y2);
  ink(g, outer * 0.86);
  g.stroke();
  g.beginPath();
  g.moveTo(x1, y1);
  g.quadraticCurveTo(c2x, c2y, x2, y2);
  g.strokeStyle = SKIN;
  g.lineWidth = inner * 0.8;
  g.stroke();
}
function hand(g, x, y, side) {
  const d = side < 0 ? -1 : 1;
  g.beginPath();
  g.arc(x, y, 16, 0, Math.PI * 2);
  paint(g, SKIN, 3);
  for (const [fx, fy] of [[d * 10, -12], [d * 16, -2], [d * 12, 8]]) {
    g.beginPath();
    g.arc(x + fx, y + fy, 6, 0, Math.PI * 2);
    paint(g, SKIN, 2);
  }
  g.beginPath();
  g.ellipse(x - d * 10, y + 10, 8, 5, d * 0.5, 0, Math.PI * 2);
  paint(g, SKIN_D, 2);
}

function meat(g, x0, y0, x1, y1, radius, fill) {
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const px = Math.sin(ang) * radius;
  const py = -Math.cos(ang) * radius;
  g.beginPath();
  g.moveTo(x0 + px, y0 + py);
  g.lineTo(x1 + px, y1 + py);
  g.arc(x1, y1, radius, ang - Math.PI / 2, ang + Math.PI / 2);
  g.lineTo(x0 - px, y0 - py);
  g.arc(x0, y0, radius, ang + Math.PI / 2, ang + Math.PI * 1.5);
  g.closePath();
  paint(g, fill, 4);
}

}

function tyre(g, x, y, r) {
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  g.fillStyle = INK;
  g.fill();
  ink(g, 4);
  g.stroke();
  g.beginPath();
  g.arc(x, y, r * 0.45, 0, Math.PI * 2);
  g.fillStyle = "#3A3A3A";
  g.fill();
  g.strokeStyle = PAPER;
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(x - r * 0.28, y);
  g.lineTo(x + r * 0.28, y);
  g.moveTo(x, y - r * 0.28);
  g.lineTo(x, y + r * 0.28);
  g.stroke();
}

}
